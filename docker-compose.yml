services:
  postgres:
    # ParadeDB = Postgres + pgvector + pg_search (real BM25). Vector search is
    # unchanged; the keyword arm upgrades from ts_rank_cd to a BM25 index.
    image: paradedb/paradedb:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prorag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prorag}
      POSTGRES_DB: ${POSTGRES_DB:-prorag}
    ports:
      - "5432:5432"
    volumes:
      # PG18+ (ParadeDB latest) wants the mount at /var/lib/postgresql, not
      # .../data — the data dir becomes a subdirectory of it.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prorag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  api:
    # image: tags the versioned bundle (ghcr.io/...:v0.x per #8's resolution);
    # build: stays so `docker compose up` still works straight from source in dev.
    image: ${PRORAG_IMAGE:-prorag-api}:${PRORAG_VERSION:-dev}
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - blobdata:/app/blobs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No command: override — the image's own ENTRYPOINT (docker-entrypoint.sh)
    # runs migrations then execs its CMD, uvicorn with --forwarded-allow-ips=*,
    # which is safe here because 8000 isn't published to the host (see `expose`
    # above), so only the caddy service on the compose network can reach it.
    deploy:
      resources:
        limits:
          memory: 4g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  blobdata:
